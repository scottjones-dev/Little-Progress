name: Security

# Known-vulnerable dependencies, committed secrets and code analysis. Also runs every Monday,
# because new advisories appear without any code change. The repository is public, so CodeQL
# and dependency review are free and switch themselves on; if it ever goes private they turn
# off (they need GitHub's paid code security there) and the other jobs still protect it.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  DO_NOT_TRACK: "1"
  HUSKY: "0"

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Production dependencies only. Fails on high or critical advisories. An advisory
      # we accept is listed with a reason under "audit" in pnpm-workspace.yaml.
      - run: pnpm audit --prod --audit-level high

  osv-pull-request:
    name: OSV scan (new in this pull request)
    if: github.event_name == 'pull_request'
    # Fails only for vulnerabilities this pull request adds, not ones already on main.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      fail-on-vuln: true
      upload-sarif: false # needs GitHub code scanning, not on private repos by default

  osv-scheduled:
    name: OSV scan (everything)
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      fail-on-vuln: true
      upload-sarif: false

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, not just the latest commit
      # The same scanner and .infisicalignore as the pre-commit hook.
      - run: npm install --global @infisical/cli@0.43.138
      - run: infisical scan --verbose

  # New or changed dependencies in a pull request: known vulnerabilities and licenses.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Code analysis for JavaScript and TypeScript. Free on a public repository. The variable
  # ENABLE_CODEQL=true turns it on for a private repository that has code security.
  codeql:
    name: CodeQL
    if: github.event.repository.private == false || vars.ENABLE_CODEQL == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@88585263c0627ee42c0e1c5143a112c8d6f4aa18 # v4.38.2
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@88585263c0627ee42c0e1c5143a112c8d6f4aa18 # v4.38.2
