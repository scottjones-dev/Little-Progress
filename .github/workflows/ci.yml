name: CI

# What a pull request must prove before it merges. Every step is a command you can run
# locally (see docs/ci-cd.md), so a green local run predicts a green run here.
# No job needs real secrets: tests use throwaway local values.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same pull request cancels the older, now pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  DO_NOT_TRACK: "1" # no telemetry from Expo, Next.js and friends
  HUSKY: "0" # do not install git hooks on the runner
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm check-types
      - run: pnpm test
      # Every language must have every key. Polish, Spanish and Welsh are empty until the
      # translation service works, so this only reports for now (docs/i18n.md).
      # Remove continue-on-error to make it block.
      - run: pnpm i18n:check
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The website and the packages that build. Needs no tokens: Sentry source maps and
      # analytics are skipped, environment defaults apply.
      - run: pnpm build

  native:
    name: Expo bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Proves the app compiles into a bundle with Sentry, PostHog and i18n included.
      - run: pnpm --filter @repo/native exec expo export --platform android --output-dir "$RUNNER_TEMP/native-export"

  integration:
    name: Database migrations and storage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same images as infra/postgres and infra/storage, started fresh for each run.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: littleprogress
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d littleprogress" --health-interval 5s --health-timeout 3s --health-retries 10
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
    # Throwaway values for the two disposable containers above, not secrets. They are
    # the same ones used for local development.
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/littleprogress
      S3_ACCESS_KEY_ID: test
      S3_BUCKET: littleprogress-dev
      S3_ENDPOINT: http://localhost:4566
      S3_FORCE_PATH_STYLE: "true"
      S3_REGION: us-east-1
      S3_SECRET_ACCESS_KEY: test
      STORAGE_DRIVER: s3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # Do these directly instead of the package scripts, which wrap them in
      # `infisical run` for local development.
      - name: Migrations are consistent
        run: pnpm --filter @repo/db exec drizzle-kit check
      - name: Every migration applies to an empty database
        run: pnpm --filter @repo/db exec drizzle-kit migrate

      - name: Wait for the S3 emulator
        run: |
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:4566; then exit 0; fi
            sleep 2
          done
          echo "The S3 emulator did not start" >&2
          exit 1
      - name: Create the bucket and its CORS rules
        run: pnpm --filter @repo/storage exec tsx src/server/init.ts
      - name: Storage works against the emulator
        run: pnpm --filter @repo/storage exec vitest run integration
