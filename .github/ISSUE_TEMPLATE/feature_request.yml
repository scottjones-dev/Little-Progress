name: Idea or feature request
description: Suggest something that would help families or contributors
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem first, then your idea. **Do not include real personal or health data**; use made-up examples.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve, and for whom?
      description: For example, "a nursery worker logging a meal one-handed".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways to solve it you considered
  - type: checkboxes
    id: help
    attributes:
      label: Helping
      options:
        - label: I would like to work on this myself
