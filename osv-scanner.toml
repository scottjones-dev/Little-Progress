# Vulnerabilities we have looked at and accepted for the OSV scan (.github/workflows/security.yml).
# The same ones are accepted for `pnpm audit` in pnpm-workspace.yaml. Every entry has a reason
# and a date to look again; after that date the scan fails again so it cannot be forgotten.
# All of these come from Expo's command line tooling that builds the app on our machines and
# in CI. None of it is part of the app that runs on phones or on the server.

[[IgnoredVulns]]
id = "GHSA-86w9-cpqp-85rv"
ignoreUntil = 2026-12-01
reason = "node-forge RSA signature check. No patched version exists. Used by Expo's code-signing tooling (@expo/cli) at build time only."

[[IgnoredVulns]]
id = "GHSA-w5hq-g745-h8pq"
ignoreUntil = 2026-12-01
reason = "uuid 7 buffer bounds check in v3/v5/v6 when given an output buffer. Pulled in by xcode (Expo iOS project tooling), build time only. The fix is a major upgrade inside Expo's own dependency."

[[IgnoredVulns]]
id = "GHSA-vcc3-ghjq-m6fr"
ignoreUntil = 2026-12-01
reason = "decode-uri-component denial of service on crafted input. Pulled in by Expo's dev server tooling, which only handles our own local requests. The fix (0.5) is a major upgrade inside Expo's dependency."
