packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@sentry/cli": true
  "@tailwindcss/oxide": false
  core-js: false
  esbuild: true

# The email preview tool (@react-email/ui, a dev dependency of packages/emails) pins its own
# copy of next 16.3.3, which has a critical advisory fixed in 16.3.6. Its newest release still
# pins it, so we point it at the version the website already uses. Remove this when
# @react-email/ui ships with a patched next.
overrides:
  "@react-email/ui>next": 16.3.7
  # Nativewind 5 (apps/native) fails to read global.css with other lightningcss versions.
  lightningcss: 1.30.1

# Advisories we have looked at and accepted. Each needs a reason and a date to look again.
audit:
  ignore:
    # node-forge RSA signature check (high, no patched version exists). It comes in through
    # Expo's command line tooling (@expo/cli, code signing), which runs on our machines and
    # in CI to build the app; it is not part of the app that ships to phones.
    # Look again when Expo updates its dependencies (check 2026-12-01).
    - GHSA-86w9-cpqp-85rv

minimumReleaseAgeExclude:
  - pg-cloudflare@1.4.1
  - pg-connection-string@2.14.1
  - pg-protocol@1.16.1
  - pg@8.23.1
  - "@aws-sdk/client-s3@3.1144.0"
  - "@aws-sdk/s3-request-presigner@3.1144.0"
